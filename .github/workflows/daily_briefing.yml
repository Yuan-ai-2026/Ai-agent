name: Daily Finance Briefing

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dify Workflow & Send to Telegram
        env:
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
          DIFY_BASE_URL: ${{ secrets.DIFY_BASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "1. 正在调用 Dify 工作流..."
          
          # 发送 POST 请求触发 Dify 工作流
          RESPONSE=$(curl -s -X POST "${DIFY_BASE_URL}/workflows/run" \
            -H "Authorization: Bearer ${DIFY_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{
              "inputs": {},
              "response_mode": "blocking",
              "user": "github_cron_bot"
            }')

          echo "Dify 原始响应逻辑已获取..."

          # 使用 Python 处理 JSON 并兼容不同的输出字段名称
          PYTHON_SCRIPT=$(cat << 'EOF'
          import json, os

          res_str = os.environ.get('RESPONSE', '{}')
          try:
              data = json.loads(res_str)
              outputs = data.get('data', {}).get('outputs', {})
              
              # 自动适配常用的输出字段名 (text, result, output 等)
              text = outputs.get('text') or outputs.get('result') or outputs.get('output')
              
              # 如果 outputs 是单一字符串值或找不到 key，尝试提取第一个 value
              if not text and isinstance(outputs, dict) and len(outputs) > 0:
                  text = list(outputs.values())[0]

              if not text:
                  text = "Dify 已执行成功，但未捕获到 outputs 中的文本。请检查 Dify 工作流结束节点的变量输出名称。"
          except Exception as e:
              text = f"解析 Dify 响应失败: {e}"

          print(text)
          EOF
          )

          TEXT=$(RESPONSE="$RESPONSE" python3 -c "$PYTHON_SCRIPT")

          echo "=== 提取的主体内容 ==="
          echo "$TEXT"
          echo "========================"

          echo "2. 正在推送到 Telegram..."
          
          # 格式化并清理 Bot Token（防止多填 bot 前缀或多余空格）
          CLEAN_TOKEN=$(echo "${TELEGRAM_BOT_TOKEN}" | sed 's/^bot//i' | xargs)
          
          TG_RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${CLEAN_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg chat_id "$TELEGRAM_CHAT_ID" \
              --arg text "$TEXT" \
              '{chat_id: $chat_id, text: $text}')")
          
          echo "Telegram 接口响应: $TG_RESPONSE"
