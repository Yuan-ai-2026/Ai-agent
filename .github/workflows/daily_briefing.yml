name: Daily Finance Briefing

on:
  schedule:
    - cron: '30 7 * * *'
      timezone: "Asia/Shanghai"
  workflow_dispatch:

jobs:
  run-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Dify Workflow & Send to Telegram
        env:
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
          DIFY_BASE_URL: ${{ secrets.DIFY_BASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          set -e

          echo "======================================"
          echo "1. 正在调用 Dify 工作流..."
          echo "======================================"

          # 使用 streaming 模式，避免长时间 blocking 导致 504
          curl -sS --no-buffer \
            -X POST "${DIFY_BASE_URL}/workflows/run" \
            -H "Authorization: Bearer ${DIFY_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{
              "inputs": {},
              "response_mode": "streaming",
              "user": "github_cron_bot"
            }' \
            > dify_stream.txt

          echo "Dify 工作流调用结束"

          echo "======================================"
          echo "2. 解析 Dify 最终结果..."
          echo "======================================"

          python3 << 'PY'
          import json

          output = ""

          with open("dify_stream.txt", "r", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()

                  if not line.startswith("data:"):
                      continue

                  raw = line[5:].strip()

                  try:
                      data = json.loads(raw)
                  except Exception:
                      continue

                  # 找到 workflow_finished 事件
                  if data.get("event") == "workflow_finished":
                      workflow_data = data.get("data", {})

                      outputs = workflow_data.get("outputs", {})

                      # 我们之前已经把 Dify 结束节点改成 text
                      output = outputs.get("text", "")

                      # 如果 text 没有，兼容之前的 summary
                      if not output:
                          output = outputs.get("summary", "")

          import re

          if not output:
              print("ERROR: Dify 没有返回最终文本")
              exit(1)
          
          # 清理模型可能返回的思考过程
          # 例如：
          # <think>
          # ......内部推理......
          # </think>
          output = re.sub(
              r"<think>.*?</think>",
              "",
              output,
              flags=re.DOTALL | re.IGNORECASE
          )
          
          # 兼容某些模型只有 <think> 没有 </think> 的情况
          output = re.sub(
              r"<think>.*$",
              "",
              output,
              flags=re.DOTALL | re.IGNORECASE
          )

          # 清理 Markdown 粗体符号
          output = output.replace("**", "")

          # 清理 Markdown 粗体符号
          output = output.replace("##", "")
          
          # 清理 Dify/DeepSeek reasoning 标记
          output = output.replace("<!--dify-deepseek-reasoning-->", "")
          
          # 清理开头多余空行
          output = output.strip()
          
          with open("finance_report.txt", "w", encoding="utf-8") as f:
              f.write(output)
          
          print("思考过程已过滤")
          print("最终报告长度:", len(output))

          print("Dify 报告获取成功！")
          print("报告长度:", len(output))
          PY

          echo "======================================"
          echo "3. 检查报告..."
          echo "======================================"

          cat finance_report.txt

          echo ""
          echo "======================================"
          echo "4. 推送 Telegram..."
          echo "======================================"

          # Telegram 单条消息最大约 4096 字符
          # 因此把长报告自动拆分
          python3 << 'PY'
          import os
          import json
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          with open("finance_report.txt", "r", encoding="utf-8") as f:
              text = f.read()

          # Telegram 每条消息控制在 4000 字符以内
          chunks = []

          while len(text) > 4000:
              # 尽量在换行处切割
              pos = text.rfind("\n", 0, 4000)

              if pos < 1000:
                  pos = 4000

              chunks.append(text[:pos])
              text = text[pos:]

          if text:
              chunks.append(text)

          print(f"报告共拆分为 {len(chunks)} 条 Telegram 消息")

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          for i, chunk in enumerate(chunks, 1):

              payload = {
                  "chat_id": chat_id,
                  "text": chunk
              }

              data = json.dumps(payload).encode("utf-8")

              req = urllib.request.Request(
                  url,
                  data=data,
                  headers={
                      "Content-Type": "application/json"
                  },
                  method="POST"
              )

              with urllib.request.urlopen(req) as response:
                  result = response.read().decode("utf-8")

              print(f"Telegram 第 {i}/{len(chunks)} 条发送成功")

          print("======================================")
          print("全部推送完成！")
          print("======================================")
          PY
